services:
  app:
    build: .
    image: taskforge:local
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://db:5432/taskforge
      DB_USERNAME: taskforge
      # Docker Compose reads DB_PASSWORD from the local .env file by default.
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in a private environment file}
      SERVER_PORT: 8080
      SERVER_SSL_ENABLED: "false"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8081}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    stop_grace_period: 40s

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: taskforge
      POSTGRES_USER: taskforge
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in a private environment file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskforge -d taskforge"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
