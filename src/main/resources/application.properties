spring.application.name=sk14

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/taskforge}
spring.datasource.username=${DB_USERNAME:taskforge}
spring.datasource.password=${DB_PASSWORD:taskforge}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

logging.level.root=INFO
logging.level.com.sk.taskforge=DEBUG

# Expose the health endpoint and Boot's liveness/readiness health groups.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
