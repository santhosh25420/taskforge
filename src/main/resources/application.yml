spring:
  application:
    name: sk14

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/taskforge}
    username: ${DB_USERNAME:taskforge}
    password: ${DB_PASSWORD:taskforge}
    driver-class-name: org.postgresql.Driver

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
