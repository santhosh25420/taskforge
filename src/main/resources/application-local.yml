spring:
  application:
    name: sk14

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/taskforge_test}
    username: ${DB_USERNAME:taskforge_test}
    password: ${DB_PASSWORD:taskforge_test}
    driver-class-name: org.postgresql.Driver

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    root: INFO
    com.sk.taskforge: DEBUG
