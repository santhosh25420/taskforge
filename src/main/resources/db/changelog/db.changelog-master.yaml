databaseChangeLog:
  - changeSet:
      id: 001-initial-schema
      author: taskforge
      changes:
        - sqlFile:
            path: 001-create-users-and-organisations.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: false
      rollback:
        - sql:
            sql: |
              DROP TABLE IF EXISTS organisations;
              

  - changeSet:
        id: 002-create-project-table
        author: taskforge
        changes:
          - sqlFile:
              path: 002-create-project-table.sql
              relativeToChangelogFile: true
              splitStatements: true
              stripComments: false
        rollback:
          - sql:
              sql: |
                DROP TABLE IF EXISTS projects;
